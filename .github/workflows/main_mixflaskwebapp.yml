# Deploys app.py to the Azure Web App 'mixflaskwebapp'.
#
# Azure installs requirements.txt server-side (SCM_DO_BUILD_DURING_DEPLOYMENT=true
# is set on the app), so this workflow ships sources only and does not build.
#
# Auth is OIDC against a user-assigned managed identity. The three secrets below
# are identifiers, not credentials -- the trust comes from the identity's
# federated credential, which is pinned to this repo and the main branch.
name: Build and deploy Python app to Azure Web App - mixflaskwebapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Health smoke test
        env:
          MIX_CLIENT_ID: ci-placeholder
          MIX_CLIENT_SECRET: ci-placeholder
          MIX_USERNAME: ci-placeholder
          MIX_PASSWORD: ci-placeholder
        run: |
          python -c "
          import app
          r = app.app.test_client().get('/health')
          assert r.status_code == 200, r.status_code
          print('health ok:', r.get_json())
          "

      - name: Package tracked sources
        # git archive ships exactly what is committed: no venv, no __pycache__,
        # no stray local files. 'zip ./* -r' used to sweep all of that in.
        run: git archive --format=zip -o release.zip HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # No 'environment:' here on purpose. Declaring one changes the OIDC token
    # subject from repo:OWNER/REPO:ref:refs/heads/main to
    # repo:OWNER/REPO:environment:NAME, which no longer matches the federated
    # credential on mixflaskwebapp-gh-id. To reinstate the environment, add a
    # second federated credential whose subject is the environment form.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip -o release.zip && rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE583550BC314D3486C0B16AB6CA3A8C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_971BAEBBB0C94C37A19DE99172C54CC8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D63466C58F474D3FA3FEFD476ED89940 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'mixflaskwebapp'
          slot-name: 'Production'

      - name: Verify /health
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://mixflaskwebapp.azurewebsites.net/health || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then curl -s https://mixflaskwebapp.azurewebsites.net/health; exit 0; fi
            sleep 15
          done
          echo "::error::/health did not return 200 after deploy"
          exit 1
